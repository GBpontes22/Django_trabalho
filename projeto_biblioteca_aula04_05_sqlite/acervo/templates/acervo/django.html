{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'acervo/estilo.css' %}">
</head>
<body>
    <header class="cabecalho">
        <div class="container">
            <h1>Biblioteca</h1>
            <nav>
                <a href="{% url 'lista' %}">Acervo</a>
                <a href="{% url 'novo_livro' %}">Cadastrar livro</a>
                <a href="/admin/">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block conteudo %}{% endblock %}
    </main>

    <footer>
        <p>Projeto Django</p>
    </footer>
</body>
</html>
